# HUD ala FiveM. x = piksel dari TENGAH layar (negatif = kiri, positif = kanan).
# align: right -> x dianggap tepi KANAN elemen.
# Tipe layer: image | text | number (angka besar) | meter (bar / cincin) | bar | animation
# Placeholder: %money% (uang kantong) %bank% (uang bank) %job% %gang% %health% %armor% %food% %time% %online%
span: 240
rows:
  # ================= POJOK KANAN ATAS =================
  # Minecraft hanya menampilkan boss bar sampai 1/3 tinggi layar, jadi dibuat 4 baris saja.
  # Baris 1: logo server (ganti dengan /uistudio logo) + uang kantong (putih)
  - type: bossbar
    layers:
      - { type: image, id: logo, x: 208, align: right }
      - { type: text, text: "<white>$%money%", x: 172, align: right }
  # Baris 2: uang bank (merah), ukuran sama dengan uang kantong
  - type: bossbar
    layers:
      - { type: text, text: "<red>$%bank%", x: 172, align: right }
  # Baris 3: pekerjaan
  - type: bossbar
    layers:
      - { type: text, text: "<white>%job%", x: 172, align: right }
      - { type: image, id: ic_job, x: 175 }
  # Baris 4: gang / keluarga
  - type: bossbar
    layers:
      - { type: text, text: "<yellow>%gang%", x: 172, align: right }
      - { type: image, id: ic_gang, x: 175 }

  # ================= POJOK KIRI BAWAH (action bar) =================
  - type: actionbar
    layers:
      # bar darah (merah) dan armor (cyan), bertumpuk
      - { type: meter, image: hpbar, steps: 20, x: -208, value: "%health%", max: 20, color: "#ff3b3b", bg: "#3a1a1a" }
      - { type: meter, image: arbar, steps: 20, x: -208, value: "%armor%", max: 20, color: "#35d0ff", bg: "#102a33" }
      # cincin: lapar, napas, stamina (saturasi), mikrofon
      - { type: meter, image: ring, steps: 20, x: -108, value: "%food%", max: 20, color: "#ffb84d", bg: "#33301f", icon: ico_food }
      - { type: meter, image: ring, steps: 20, x: -82, value: "%air%", max: 100, color: "#3da5ff", bg: "#1c2a3a", icon: ico_water }
      - { type: meter, image: ring, steps: 20, x: -56, value: "%saturation%", max: 20, color: "#ffd53c", bg: "#33301f", icon: ico_run }
      - { type: meter, image: ring, steps: 20, x: -30, value: "%voice_value%", max: 100, color: "%voice_color%", bg: "#2a2a30", icon: "%voice_icon%" }
